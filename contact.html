<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="author" content="Mukul Kukreja">
    <meta name="description" content="This is 3rd page of the web of a Taco website">
    <link rel="stylesheet" href="web.css">
    <title>Contact Us</title>
  </head>
  <body>
    <fieldset>
      <header>
        <h1>Contact Us</h1>
        <nav>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#LTS">About LTS</a></li>
            <li><a href="index.html#menu">Our Menu</a></li>
            <li><a href="time.html">Store Hours</a></li>
          </ul>
        </nav>
      </header>
      <main>
        <figure>
          <img src="img/OIP (1).webp" alt="taco3">
          <figcaption>Little Taco Shop Tacos</figcaption>
        </figure>
        <h2>Our Contact Form</h2>
        <form action="bin..." method="get">
          <fieldset>
            <legend>Send Us a Message</legend>
            <p>
              <label for="name">Name:</label>
              <input type="text" id="name" placeholder="your name" required>
            </p>
            <p>
              <label for="email">Email:</label>
              <input type="email" name="email" id="email" pattern="[a-zA-Z0-9._%+-]+@gmail\.com" required>
            </p>
            <p>
              <label for="message">Your Message:</label>
              <br>
              <textarea name="message" id="message" cols="30" rows="10" placeholder="Type your message here"></textarea>
            </p>
          </fieldset>
          <button type="submit">Send</button>
          <button type="reset">Reset</button>
        </form>
        <h2>Our Location</h2>
        <address>
          555 Taco Templlation Lane,Suite T Kansas City; MO 55555-5555
        </address>
        <label for="phone">Phone:</label>
        <a href="phone">555-555-5555</a>
        <a href="#">Back to Top</a>
        <hr>
      </main>
      <footer>
        <p>Copyright &copy; The Little Taco Shop</p>
      </footer>
    </fieldset>
  </body>
</html>
